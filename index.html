<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wishlist-to-Purchase</title>
<style>
:root{
  color-scheme: light dark;
  --bg:light-dark(#f7f6f4,#131113);
  --panel:light-dark(#ffffff,#1c191d);
  --ink:light-dark(#1a141b,#efe7ea);
  --muted:light-dark(#6d6169,#9c8d94);
  --line:light-dark(#e5dfe2,#2c242e);
  --accent:light-dark(#e0325c,#ff5c82);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
main{max-width:900px;margin:0 auto;padding:12vh 24px 14vh}
h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
a.card{display:flex;align-items:center;gap:10px;padding:20px 22px;border:1px solid var(--line);
  border-radius:12px;background:var(--panel);text-decoration:none;color:inherit;font-size:17px;
  font-weight:600;letter-spacing:-.01em;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card .arr{margin-left:auto;color:var(--accent);font-weight:600}
h3.sec{margin:44px 0 14px;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
a.live{display:flex;align-items:center;gap:10px;padding:18px 22px;border:1px solid var(--line);
  border-radius:12px;text-decoration:none;color:inherit;font-size:16px;font-weight:600;
  letter-spacing:-.01em;transition:border-color .15s,transform .15s}
a.live:hover{border-color:var(--accent);transform:translateY(-2px)}
a.live .arr{margin-left:auto;color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
</style>
</head>
<body>
<main>
  <h1>Wishlist&#8209;to&#8209;purchase</h1>
  <div class="cards">
    <a class="card" href="engine/">Discovery Engine<span class="arr">&rarr;</span></a>
    <a class="card" href="prototype/">Smart Wishlist prototype<span class="arr">&rarr;</span></a>
    <a class="card" href="architecture/">Smart Wishlist architecture<span class="arr">&rarr;</span></a>
  </div>

  <h3 class="sec">Primary research &#183; live</h3>
  <div class="two">
    <a class="live" href="https://docs.google.com/forms/d/e/1FAIpQLSfYG_Ih3OONDaDk4gCxGVADXpPI94QWJmSWZOZu8yh7K5rx0A/viewform" target="_blank" rel="noopener">
      <span class="dot"></span>Google form<span class="arr">&rarr;</span>
    </a>
    <a class="live" href="https://docs.google.com/spreadsheets/d/1Q8gFIpk0y_aE6bW1zZ67oF6EhcoBSfcAnVtsIYiJWYU/edit?resourcekey=&amp;gid=1757307896#gid=1757307896" target="_blank" rel="noopener">
      <span class="dot"></span>Responses<span class="arr">&rarr;</span>
    </a>
    <a class="live" href="https://docs.google.com/document/d/1RAEUhLJNJOJzkaEVdkQZW_5SPVwG0zjN-y2_xNPYQuo/edit?tab=t.0" target="_blank" rel="noopener">
      <span class="dot"></span>User Interviews<span class="arr">&rarr;</span>
    </a>
  </div>
</main>
</body>
</html>
